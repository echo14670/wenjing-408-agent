name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 后端测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = 线上 Docker 运行时基准；3.12 = 前瞻兼容性检查
        python-version: ["3.11", "3.12"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: 运行测试
        working-directory: backend
        run: python -m pytest -q
