name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# package-lock.json 的 resolved 指向 registry.npmmirror.com；CI 统一切到官方源并改写 lockfile host，
# 避免依赖镜像站的偶发 500 造成假红。
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  fast:
    name: 快测（chunk / chunk-pro / practice）
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（lockfile 锁定）
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 运行快测
        working-directory: frontend
        run: npm run test:fast

  slow:
    name: 契约/答疑链路 + 构建
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（lockfile 锁定）
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 运行契约与答疑链路测试
        working-directory: frontend
        run: npm run test:slow

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 归档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
